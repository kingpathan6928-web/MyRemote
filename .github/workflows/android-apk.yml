name: Build MyRemote Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name shown under the app icon'
        required: true
        default: 'MyRemote Test App'
        type: string
      application_id:
        description: 'Unique Android package ID'
        required: true
        default: 'com.myremote.generatedapp'
        type: string
      start_url:
        description: 'HTTPS website URL to open in the app'
        required: true
        default: 'https://example.com/'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate inputs
        env:
          APP_NAME: ${{ inputs.app_name }}
          APPLICATION_ID: ${{ inputs.application_id }}
          START_URL: ${{ inputs.start_url }}
        run: |
          if [[ ! "$START_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo 'start_url must be a valid-looking HTTPS URL.' >&2
            exit 1
          fi
          if [[ ! "$APPLICATION_ID" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo 'application_id is not a valid Android application ID.' >&2
            exit 1
          fi
          if [[ -z "$APP_NAME" ]]; then
            echo 'app_name cannot be empty.' >&2
            exit 1
          fi

      - name: Build debug APK
        working-directory: android-webview-template
        env:
          APP_NAME: ${{ inputs.app_name }}
          APPLICATION_ID: ${{ inputs.application_id }}
          START_URL: ${{ inputs.start_url }}
        run: >-
          gradle assembleDebug
          -PAPP_NAME="$APP_NAME"
          -PAPPLICATION_ID="$APPLICATION_ID"
          -PSTART_URL="$START_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myremote-debug-apk
          path: android-webview-template/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
