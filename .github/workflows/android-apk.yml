
name: Build MyRemote Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name shown under the app icon'
        required: true
        default: 'MyRemote Test App'
        type: string
      application_id:
        description: 'Unique Android package ID'
        required: true
        default: 'com.myremote.generatedapp'
        type: string
      start_url:
        description: 'HTTPS website URL to open in the app'
        required: true
        default: 'https://example.com/'
        type: string
      icon_url:
        description: 'Temporary app icon URL'
        required: false
        type: string
      build_id:
        description: 'MyRemote build record ID'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Update build status - Preparing
        env:
          BUILD_ID: ${{ inputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -n "$BUILD_ID" ]]; then
            curl --fail --silent --show-error \
              -X PATCH "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"building\",\"progress\":5,\"progress_stage\":\"Preparing\",\"github_run_id\":\"$GITHUB_RUN_ID\",\"github_run_attempt\":$GITHUB_RUN_ATTEMPT}"
          fi

      - name: Validate inputs
        env:
          APP_NAME: ${{ inputs.app_name }}
          APPLICATION_ID: ${{ inputs.application_id }}
          START_URL: ${{ inputs.start_url }}
        run: |
          if [[ ! "$START_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo 'start_url must be a valid-looking HTTPS URL.' >&2
            exit 1
          fi

          if [[ ! "$APPLICATION_ID" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo 'application_id is not a valid Android application ID.' >&2
            exit 1
          fi

          if [[ -z "$APP_NAME" || ${#APP_NAME} -gt 50 ]]; then
            echo 'app_name must contain 1 to 50 characters.' >&2
            exit 1
          fi

      - name: Install image processing library
        run: python3 -m pip install Pillow

      - name: Download app icon
        env:
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          if [[ -n "$ICON_URL" ]]; then
            python3 -c 'import os,sys,urllib.parse; u=urllib.parse.urlparse(os.environ["ICON_URL"]); sys.exit(0 if u.scheme=="https" and u.hostname=="dvgsamumziqriwcbopam.supabase.co" and u.path.startswith("/storage/v1/object/sign/app-assets/") else 1)' || {
              echo "Invalid icon URL."
              exit 1
            }
            curl --fail --silent --show-error --location \
              "$ICON_URL" -o /tmp/myremote-icon
          else
            echo "No custom icon supplied. A default icon will be generated."
          fi

      - name: Generate Android launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          source = Path("/tmp/myremote-icon")
          output = Path("android-webview-template/app/src/main/res")

          if source.exists():
              try:
                  original = Image.open(source).convert("RGBA")
                  original.thumbnail((768, 768), Image.Resampling.LANCZOS)
              except Exception as e:
                  raise SystemExit(f"Invalid icon image: {e}")

              canvas = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
              x = (1024 - original.width) // 2
              y = (1024 - original.height) // 2
              canvas.alpha_composite(original, (x, y))
          else:
              canvas = Image.new("RGBA", (1024, 1024), (35, 90, 200, 255))
              draw = ImageDraw.Draw(canvas)
              try:
                  font = ImageFont.truetype("DejaVuSans-Bold.ttf", 560)
              except OSError:
                  font = ImageFont.load_default()
              box = draw.textbbox((0, 0), "M", font=font)
              tw, th = box[2] - box[0], box[3] - box[1]
              draw.text(
                  ((1024 - tw) / 2 - box[0], (1024 - th) / 2 - box[1]),
                  "M", fill="white", font=font
              )

          densities = {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192,
          }

          for density, size in densities.items():
              folder = output / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = canvas.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", "PNG")
              icon.save(folder / "ic_launcher_round.png", "PNG")

          print("Android launcher icons generated successfully.")
          PY

      - name: Update build status - Building APK
        env:
          BUILD_ID: ${{ inputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -n "$BUILD_ID" ]]; then
            curl --fail --silent --show-error \
              -X PATCH "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"status":"building","progress":30,"progress_stage":"Building APK"}'
          fi

      - name: Build debug APK
        working-directory: android-webview-template
        env:
          APP_NAME: ${{ inputs.app_name }}
          APPLICATION_ID: ${{ inputs.application_id }}
          START_URL: ${{ inputs.start_url }}
        run: >-
          gradle assembleDebug
          -PAPP_NAME="$APP_NAME"
          -PAPPLICATION_ID="$APPLICATION_ID"
          -PSTART_URL="$START_URL"

      - name: Update build status - APK built
        env:
          BUILD_ID: ${{ inputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -n "$BUILD_ID" ]]; then
            curl --fail --silent --show-error \
              -X PATCH "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"status":"uploading","progress":80,"progress_stage":"Uploading APK"}'
          fi

      - name: Upload APK to private Supabase Storage
        id: private_upload
        env:
          BUILD_ID: ${{ inputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          APK_FILE=$(find android-webview-template/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)

          if [[ -z "$APK_FILE" ]]; then
            echo "APK file not found."
            exit 1
          fi

          STORAGE_PATH="builds/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.apk"

          curl --fail --silent --show-error \
            -X POST "$SUPABASE_URL/storage/v1/object/apk-builds/$STORAGE_PATH" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@$APK_FILE"

          echo "storage_path=$STORAGE_PATH" >> "$GITHUB_OUTPUT"

          if [[ -n "$BUILD_ID" ]]; then
            curl --fail --silent --show-error \
              -X PATCH "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"status\":\"completed\",\"progress\":100,\"progress_stage\":\"Completed\",\"apk_path\":\"$STORAGE_PATH\",\"storage_path\":\"$STORAGE_PATH\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myremote-debug-apk
          path: android-webview-template/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Mark build failed
        if: failure()
        env:
          BUILD_ID: ${{ inputs.build_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -n "$BUILD_ID" ]]; then
            curl --silent --show-error \
              -X PATCH "$SUPABASE_URL/rest/v1/builds?id=eq.$BUILD_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"status":"failed","progress_stage":"Build failed","error_message":"The APK build or upload failed."}'
          fi
